<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">FI</div>
    <div class="brand-text">
      <h1>Fixed Income Studio</h1>
      <p>Curves &middot; Rates &middot; Premia</p>
    </div>
    <button class="btn small ghost collapse-btn" id="btn-collapse" title="Collapse sidebar" aria-label="Collapse sidebar"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
  </div>

  <nav class="nav" aria-label="Sections">
    <div class="nav-group">Curve</div>
    <button class="nav-item active" data-tab="fitter" title="Alt+1"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-curve"/></svg></span><span class="nav-label">Curve Fitter</span></button>
    <button class="nav-item" data-tab="explorer" title="Alt+2"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg></span><span class="nav-label">Parameter Lab</span></button>
    <div class="nav-group">Dynamics</div>
    <button class="nav-item" data-tab="historical" title="Alt+3"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-history"/></svg></span><span class="nav-label">Historical Factors</span></button>
    <button class="nav-item" data-tab="compare" title="Alt+4"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-compare"/></svg></span><span class="nav-label">Treasury vs TIPS</span></button>
    <div class="nav-group">Rates &amp; premia</div>
    <button class="nav-item" data-tab="shortrate" title="Alt+5"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-shortrate"/></svg></span><span class="nav-label">Short-Rate Models</span></button>
    <button class="nav-item" data-tab="termpremium" title="Alt+6"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-premium"/></svg></span><span class="nav-label">Term Premium</span></button>
    <div class="nav-group">Tools</div>
    <button class="nav-item" data-tab="analytics" title="Alt+7"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-bars"/></svg></span><span class="nav-label">Curve Analytics</span></button>
    <button class="nav-item" data-tab="learn" title="Alt+8"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></span><span class="nav-label">Learn</span></button>
  </nav>

  <div class="sidebar-bottom">
    <div class="status-card" id="data-status">
      <div class="status-dot"></div>
      <div class="status-body">
        <div class="status-label">Data source</div>
        <div class="status-value" id="data-source-text">Detecting&hellip;</div>
        <ul class="source-list" id="data-source-list"></ul>
      </div>
    </div>

    <form class="api-key-card" id="fred-key-form">
      <label for="fred-api-key">
        <span class="status-label">FRED API key</span>
        <span class="api-key-copy">Optional. Public feeds work without one.</span>
      </label>
      <div class="api-key-row">
        <input class="input" id="fred-api-key" type="password" placeholder="Paste your FRED API key" autocomplete="off" spellcheck="false" />
        <button class="btn small" type="submit">Apply</button>
      </div>
      <p class="api-key-note" id="fred-key-note">Stored only for this running app session.</p>
    </form>

    <div class="footer-mini">
      <span id="app-version">v{{ version }}</span>
      <button class="btn small ghost" id="btn-theme" title="Toggle theme (Alt+T)"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg> Dark</button>
      <a href="https://github.com/alanvaa06/Nelson_Siegel_Model" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </div>
</aside>
